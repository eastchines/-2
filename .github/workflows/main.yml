# GitHub Actions工作流：自动构建Windows EXE程序
name: 构建 EXE

# 触发规则：代码push推送时自动执行
on: push

jobs:
  build:
    # 使用Windows虚拟机，打包Windows EXE
    runs-on: windows-latest
    steps:
      # 拉取仓库源码
      - name: 检出代码
        uses: actions/checkout@v6

      # 配置Node.js环境
      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 安装项目依赖（pkg打包工具会在这里安装）
      - name: 执行npm安装依赖
        run: npm install

      # 打包生成EXE文件
      - name: 打包生成EXE文件
        run: npm run build-exe
