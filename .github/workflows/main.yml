名称：构建 EXE: Build EXE
在：:
  推送：:
    分支：[ main ]: [ main ]

职位：:
  构建：:
    运行环境：windows-latest: windows-latest
    步骤：:
      - 名称：结账代码name: Checkout code
        使用：actions/checkout@v4: actions/checkout@v4

      - 名称：设置 Pythonname: Setup Python
        使用：actions/setup-python@v5: actions/setup-python@v5
        使用：:
          python-version: "3.11": "3.11"

      - name: 安装 Python 依赖项name: Install python dependencies
        运行：|: |
          python -m pip install --upgrade pip
          pip install pillow pyinstaller pynput

      - 名称：使用 PyInstaller 构建 exename: Build exe with PyInstaller
        运行：pyinstaller main.py -F -w --hidden-import=PIL --hidden-import=pynput --add-data "&*.png;.": pyinstaller main.py -F -w --hidden-import=PIL --hidden-import=pynput --add-data "*.png;."

      - 名称：上传工件name: Upload artifact
        使用：actions/upload-artifact@v4: actions/upload-artifact@v4
        使用：:
          名称：桌面宠物可执行文件: 桌面宠物可执行文件
          路径: dist/*.exe: dist/*.exe
