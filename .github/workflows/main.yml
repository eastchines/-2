name: 构建 EXE
on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: npm install

      - name: 打包EXE
        run: npm run build-exe # 改成你package.json里真实的打包脚本
