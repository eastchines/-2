name: 构建 EXE
on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6 # 升级版本消除Node20警告

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装依赖
        run: npm install

      - name: 打包EXE
        run: npm run build-exe # 这里替换成你实际打包命令
